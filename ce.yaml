# ce.yaml - Context Engine project configuration
# Reference: https://docs.atheory.ai/ce/config

llm:
  provider: local
project:
  arch_prompt: |-
    Compare WordPress core, Gutenberg, and WooCommerce source relationships without requiring a running WordPress instance.
    Exclude generated dependencies, caches, and build outputs from benchmark indexing.
  base_prompt: |-
    WordPress ecosystem benchmark repo containing WordPress core, Gutenberg, and WooCommerce submodules for CE comparison testing.

    Source constellation used to evaluate context acquisition across PHP, TypeScript, REST APIs, block registration, WooCommerce checkout, and product rendering flows.

    Benchmark branches compare baseline file-search agents against CE-assisted agents on the same source tasks.
  git_url: git@github.com:atheory-ai/ce-demo-wordpress.git

plugins:
  installed:
    # Build these demo-owned artifacts first: `cd plugins && pnpm install && pnpm build`.
    # PHP Language supplies the CST parser; the convention plugin adds WordPress
    # and WooCommerce facts from that same parsed tree.
    - path: ./plugins/php-language/dist/php-language.wasm
    - path: ./plugins/wordpress-conventions/dist/wordpress-conventions.wasm
