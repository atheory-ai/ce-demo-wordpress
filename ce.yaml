# ce.yaml - Context Engine project configuration
# Reference: https://docs.atheory.ai/ce/config

llm:
  # LMIR model-backed experiments use the compiled CE OpenAI ABI path. The API
  # key remains in the caller's environment (OPENAI_API_KEY), never in this
  # repository.
  provider: openai
  models:
    standard: gpt-5.6-luna
  reasoning_effort: medium

# Index-time plugin lifts are enabled deliberately. The PHP demo plugin does
# not yet emit modeled IIR, so a PHP result is navigation evidence, not a
# semantic verification pass. The standalone IIR walkthrough is TypeScript.
iir:
  enabled: true

project:
  arch_prompt: |-
    Compare WordPress core, Gutenberg, and WooCommerce source relationships without requiring a running WordPress instance.
    Exclude generated dependencies, caches, and build outputs from benchmark indexing.
  base_prompt: |-
    WordPress ecosystem benchmark repo containing WordPress core, Gutenberg, and WooCommerce submodules for CE comparison testing.

    Source constellation used to evaluate context acquisition across PHP, TypeScript, REST APIs, block registration, WooCommerce checkout, and product rendering flows.

    Benchmark branches compare baseline file-search agents against CE-assisted agents on the same source tasks.
  git_url: git@github.com:atheory-ai/ce-demo-wordpress.git

plugins:
  # Production activation is explicit: it avoids a redundant startup walk and
  # includes semantic-policy plugins which have no file extension to discover.
  # Manifest dependencies still determine execution order.
  enabled:
    - com.atheory-ai.php
    - com.atheory-ai.wordpress-demo.conventions
    - com.atheory-ai.wordpress-demo.woocommerce-conventions
    - com.atheory-ai.wordpress-demo.gutenberg-conventions
    - com.atheory-ai.typescript
    - com.atheory-ai.python
  installed:
    # Build these demo-owned framework artifacts first: `cd plugins && pnpm install && pnpm build`.
    # CE's certified PHP default supplies the CST parser; the convention plugin
    # adds WordPress facts from that same parsed tree. The policy plugins turn
    # evidence-backed IIR tags into framework-specific implementation contracts.
    - path: ./plugins/wordpress-conventions/dist/wordpress-conventions.wasm
    - path: ./plugins/woocommerce-conventions/dist/woocommerce-conventions.wasm
    - path: ./plugins/gutenberg-conventions/dist/gutenberg-conventions.wasm
