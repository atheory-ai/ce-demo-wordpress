name: Semantic Demo Regression

on:
  pull_request:
    branches: [ce]
  push:
    branches: [ce]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Released CE demo regression
    runs-on: ubuntu-latest

    steps:
      - name: Check out demo source
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml

      - name: Install Context Engine release
        env:
          CE_VERSION: 0.3.0
          CE_INSTALL_DIR: ${{ github.workspace }}/.tools
        run: |
          curl -fsSL https://raw.githubusercontent.com/atheory-ai/context-engine/v0.3.0/install.sh | sh
          .tools/ce version

      - name: Set up Go and Zig for the demo-owned PHP grammar
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.3
          cache: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Fetch pinned tree-sitter source
        run: |
          deps_dir="$RUNNER_TEMP/tree-sitter-source"
          mkdir -p "$deps_dir"
          cd "$deps_dir"
          go mod init example.com/ce-wordpress-demo-grammar
          go mod download github.com/malivvan/tree-sitter@v0.0.1

      - name: Build and test demo plugins
        working-directory: plugins
        run: |
          pnpm install --frozen-lockfile
          TREE_SITTER_SOURCE_DIR="$(go env GOMODCACHE)/github.com/malivvan/tree-sitter@v0.0.1/src" \
            pnpm --filter php-language-plugin run build:grammar
          pnpm test
          pnpm build

      - name: Validate plugin, index, and sandbox contracts
        env:
          CE_BIN: ${{ github.workspace }}/.tools/ce
          CE_DATA_DIR: ${{ runner.temp }}/ce-wordpress-demo
        run: scripts/ce-regression.sh

      - name: Validate MCP source discovery
        env:
          CE_BIN: ${{ github.workspace }}/.tools/ce
          CE_DATA_DIR: ${{ runner.temp }}/ce-wordpress-demo
        run: scripts/mcp-regression.sh

      - name: Validate bounded TypeScript IIR walkthrough
        env:
          CE_BIN: ${{ github.workspace }}/.tools/ce
          IIR_DEMO_OUT_DIR: ${{ runner.temp }}/iir-wordpress-demo
        run: scripts/iir-smoke.sh
