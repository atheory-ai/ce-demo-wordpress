name: Semantic Demo Regression

on:
  pull_request:
    branches: [ce]
  push:
    branches: [ce]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Released CE demo regression
    runs-on: ubuntu-latest

    steps:
      - name: Check out demo source
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml

      - name: Install Context Engine release
        env:
          CE_VERSION: 0.7.0
          CE_INSTALL_DIR: ${{ github.workspace }}/.tools
        run: |
          curl -fsSL "https://raw.githubusercontent.com/atheory-ai/context-engine/v${CE_VERSION}/install.sh" | sh
          .tools/ce version

      - name: Install production plugin compiler
        working-directory: plugins
        run: |
          pnpm run toolchain:install
          echo "$PWD/.tools/extism/bin" >> "$GITHUB_PATH"

      - name: Build and test demo framework plugins
        working-directory: plugins
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Validate plugin, index, and sandbox contracts
        env:
          CE_BIN: ${{ github.workspace }}/.tools/ce
          CE_DATA_DIR: ${{ runner.temp }}/ce-wordpress-demo
        run: scripts/ce-regression.sh

      - name: Validate MCP source discovery
        env:
          CE_BIN: ${{ github.workspace }}/.tools/ce
          CE_DATA_DIR: ${{ runner.temp }}/ce-wordpress-demo
        run: scripts/mcp-regression.sh

      - name: Validate bounded TypeScript IIR walkthrough
        env:
          CE_BIN: ${{ github.workspace }}/.tools/ce
          IIR_DEMO_OUT_DIR: ${{ runner.temp }}/iir-wordpress-demo
        run: scripts/iir-smoke.sh
